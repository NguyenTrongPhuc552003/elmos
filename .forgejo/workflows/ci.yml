# Codeberg CI (Forgejo Actions). Limits: codeberg-small 2 CPU / 5 min, amd64.
# elmos targets macOS; Linux runners check formatting, vet and tests, and
# cross-build the macOS binaries.
name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: vet, test, build
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          [ -z "$bad" ] || { echo "Not gofmt-formatted:"; echo "$bad"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build macOS binaries
        run: |
          GOOS=darwin GOARCH=arm64 go build -o build/elmos-darwin-arm64 ./cmd/elmos
          GOOS=darwin GOARCH=amd64 go build -o build/elmos-darwin-amd64 ./cmd/elmos
