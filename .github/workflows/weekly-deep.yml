# Weekly, and on demand: the quality gate's deep tier in CI (the owner's
# machine is not always on): go test -race, 60 s of fuzzing per target and
# every other check on the whole tree. Not a required check; it fails when
# it finds something the baseline does not hold (BLOCKER, CRITICAL or
# MAJOR), so the run shows red and GitHub notifies the owner. A fuzz
# failure's input is printed in the log; keep it under testdata/fuzz/.
name: weekly deep checks

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    name: deep tier (race detector, fuzzing; fails on new findings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The gate's tools (haven's action at the engine pin)
        uses: NguyenTrongPhuc552003/haven/.github/actions/gate-tools@d63e2d183f084984290b09881fe097f80d0e499f
      - name: Deep tier
        run: scripts/gate deep --fail-on-new
