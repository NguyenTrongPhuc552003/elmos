# GitHub Actions: vet, test and build elmos on Linux, macOS and Windows;
# the quality gate (formatting, linters, vulnerabilities) on Linux.
# elmos's full workflow targets macOS hosts; the other two check that the
# code builds and its tests pass there (multi-platform direction).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends cmake ninja-build pipx
      - name: Cached cppcheck build
        uses: actions/cache@v4
        with:
          path: ~/.cache/cppcheck-*
          key: cppcheck-${{ hashFiles('quality/gate.json') }}
      - name: The gate's engine (haven, pinned commit) and its pinned tools
        run: bash "$(scripts/gate engine-dir)/tools/gate/ci-setup.sh"
      - name: Tool versions
        run: scripts/gate doctor
      - name: Quality gate (whole tree)
        run: scripts/gate ci

  go:
    name: vet, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o build/ ./cmd/elmos

  macos-e2fsck:
    name: rootfs image passes e2fsck (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install e2fsprogs
        run: brew install e2fsprogs
      - name: Rootfs test with e2fsck available
        run: go test -run TestCreateDefaultsToOCIAndWritesACleanImage -v ./core/domain/rootfs/
